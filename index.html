<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточный Клуб</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #1c2b36;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        h2 { color: #4caf50; margin-bottom: 5px; font-size: 22px; }
        .card-table {
            background: #2e7d32;
            border: 3px solid #1b5e20;
            border-radius: 14px;
            padding: 15px;
            margin: 15px auto;
            max-width: 400px;
            min-height: 120px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }
        button {
            background: #2481cc;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            margin: 8px;
            font-weight: bold;
        }
        button:active { background: #1b639e; }
        input {
            padding: 10px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            text-align: center;
            width: 80%;
            max-width: 220px;
            margin-bottom: 8px;
            background: #222;
            color: #fff;
        }
        .section {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 10px;
            margin: 10px auto;
            max-width: 400px;
        }
        #chat-box {
            margin-top: 10px;
            font-size: 14px;
            color: #ffeb3b;
        }
    </style>
</head>
<body>

    <h2>♣️ Карточный Клуб ♠️</h2>
    <p id="user-greeting" style="font-size: 14px; color: #aaa;">Загрузка...</p>

    <div class="card-table">
        <div id="game-status">Статус: Главное меню</div>
        <div id="chat-box"></div>
    </div>

    <div id="menu-screen">
        <div class="section">
            <button onclick="createRoom()">Создать комнату</button>
        </div>

        <div class="section">
            <input type="text" id="room-code" placeholder="Введите код из 4 цифр" maxlength="4">
            <br>
            <button onclick="joinRoom()">Войти в комнату</button>
        </div>
    </div>

    <div id="game-screen" style="display:none;">
        <div class="section">
            <h3>Игровой стол</h3>
            <p id="players-list">Игроки в комнате:</p>
            <button onclick="leaveRoom()">Выйти из комнаты</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        let myName = tg.initDataUnsafe?.user?.first_name || ("Игрок_" + Math.floor(Math.random()*100));
        document.getElementById('user-greeting').innerText = "Игрок: " + myName;

        let peer = null;
        let conn = null;
        let isHost = false;

        function setStatus(text) {
            document.getElementById('game-status').innerHTML = text;
        }

        function showGameScreen(otherPlayerName) {
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            document.getElementById('players-list').innerHTML = `<b>Участники матча:</b><br>👤 ${myName} (Вы)<br>👤 ${otherPlayerName || 'Соперник'}`;
        }

        function showMenuScreen() {
            document.getElementById('menu-screen').style.display = 'block';
            document.getElementById('game-screen').style.display = 'none';
            setStatus("Статус: Главное меню");
            if(peer) peer.destroy();
        }

        // Настройки соединения с публичным STUN (обход блокировок)
        const peerOptions = {
            host: '0.peerjs.com',
            port: 443,
            secure: true,
            config: {
                'iceServers': [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:global.stun.twilio.com:3478' }
                ]
            }
        };

        function createRoom() {
            const randomCode = Math.floor(1000 + Math.random() * 9000);
            const fullId = "cardgame-" + randomCode;
            isHost = true;

            setStatus("Создание комнаты...");
            peer = new Peer(fullId, peerOptions);

            peer.on('open', () => {
                setStatus(`Комната создана!<br>Код для друга: <b style="font-size: 24px; color: #ffeb3b;">${randomCode}</b><br><span style="font-size:12px; color:#ccc;">Ожидание подключения...</span>`);
            });

            peer.on('error', (err) => {
                setStatus("Ошибка связи: " + err.type);
            });

            peer.on('connection', (connection) => {
                conn = connection;
                setupHostConnection();
            });
        }

        function joinRoom() {
            const codeInput = document.getElementById('room-code').value.trim();
            if (codeInput.length !== 4) {
                alert("Введите ровно 4 цифры кода!");
                return;
            }

            isHost = false;
            setStatus("Подключение к комнате " + codeInput + "...");
            peer = new Peer(peerOptions);

            peer.on('open', () => {
                conn = peer.connect("cardgame-" + codeInput);
                setupGuestConnection();
            });

            peer.on('error', (err) => {
                setStatus("Не удалось найти комнату.");
            });
        }

        function setupHostConnection() {
            conn.on('open', () => {
                // Отправляем свое имя гостю
                conn.send({ type: 'hello', name: myName });
            });

            conn.on('data', (data) => {
                if (data.type === 'hello') {
                    setStatus("<span style='color: #4caf50;'>Игрок подключился!</span>");
                    showGameScreen(data.name);
                }
            });

            conn.on('close', () => {
                alert("Соединение разорвано.");
                showMenuScreen();
            });
        }

        function setupGuestConnection() {
            conn.on('open', () => {
                setStatus("<span style='color: #4caf50;'>Вход выполнен успешно!</span>");
                // Отправляем свое имя хосту
                conn.send({ type: 'hello', name: myName });
            });

            conn.on('data', (data) => {
                if (data.type === 'hello') {
                    showGameScreen(data.name);
                }
            });

            conn.on('close', () => {
                alert("Соединение разорвано.");
                showMenuScreen();
            });
        }

        function leaveRoom() {
            if(conn) conn.close();
            showMenuScreen();
        }
    </script>
</body>
</html>
