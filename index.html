<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточный Клуб</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #1c2b36;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        h2 { color: #4caf50; margin-bottom: 5px; font-size: 22px; }
        .card-table {
            background: #2e7d32;
            border: 3px solid #1b5e20;
            border-radius: 14px;
            padding: 15px;
            margin: 15px auto;
            max-width: 400px;
            min-height: 120px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
            position: relative;
        }
        button {
            background: #2481cc;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            margin: 8px;
            font-weight: bold;
        }
        button:active { background: #1b639e; }
        input {
            padding: 10px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            text-align: center;
            width: 80%;
            max-width: 220px;
            margin-bottom: 8px;
            background: #222;
            color: #fff;
        }
        .section {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 10px;
            margin: 10px auto;
            max-width: 400px;
        }
        #players-list {
            font-size: 15px;
            color: #ffeb3b;
            margin-top: 10px;
            line-height: 1.6;
            text-align: left;
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 6px;
        }
        
        /* Кнопка чата скрыта по умолчанию в меню */
        .chat-toggle-btn {
            display: none;
            position: absolute;
            bottom: 12px;
            left: 12px;
            width: 46px;
            height: 46px;
            background: #2481cc;
            border: 2px solid #fff;
            border-radius: 50%;
            color: white;
            font-size: 20px;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            z-index: 5;
            transition: transform 0.1s;
        }
        .chat-toggle-btn:active { transform: scale(0.9); }

        /* Окно чата */
        #chat-modal {
            display: none;
            position: fixed;
            bottom: 70px;
            left: 15px;
            right: 15px;
            max-width: 380px;
            margin: 0 auto;
            background: #1e2a38;
            border: 2px solid #2481cc;
            border-radius: 14px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            z-index: 10;
            overflow: hidden;
            text-align: left;
        }
        .chat-header {
            background: #2481cc;
            padding: 10px 15px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }
        .chat-close {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            padding: 0;
            margin: 0;
        }
        #chat-messages {
            height: 150px;
            overflow-y: auto;
            padding: 10px;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(0,0,0,0.2);
        }
        .chat-msg {
            background: rgba(255,255,255,0.08);
            padding: 6px 10px;
            border-radius: 8px;
            word-break: break-word;
        }
        .chat-msg b { color: #4caf50; }
        .chat-input-area {
            display: flex;
            padding: 8px;
            background: #16222c;
            gap: 6px;
        }
        .chat-input-area input {
            width: 100%;
            max-width: none;
            margin: 0;
            padding: 8px;
            font-size: 13px;
        }
        .chat-input-area button {
            margin: 0;
            padding: 8px 14px;
            font-size: 13px;
        }

        .footer-version {
            margin-top: 30px;
            font-size: 12px;
            color: #778899;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <h2>♣️ Карточный Клуб ♠️</h2>
    <p id="user-greeting" style="font-size: 14px; color: #aaa;">Загрузка...</p>

    <div class="card-table">
        <div id="game-status">Статус: Главное меню</div>
        <button id="chat-btn" class="chat-toggle-btn" onclick="toggleChat()" title="Чат">💬</button>
    </div>

    <!-- Окно чата -->
    <div id="chat-modal">
        <div class="chat-header">
            <span>Чат комнаты</span>
            <button class="chat-close" onclick="toggleChat()">✕</button>
        </div>
        <div id="chat-messages">
            <div style="color: #aaa; text-align: center; margin-top: 40px;">Нет сообщений...</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Написать сообщение..." maxlength="100" onkeypress="checkEnter(event)">
            <button onclick="sendChatMessage()">Отправить</button>
        </div>
    </div>

    <div id="menu-screen">
        <div class="section">
            <button onclick="createRoom()">Создать комнату</button>
        </div>

        <div class="section">
            <input type="text" id="room-code" placeholder="Введите код из 4 цифр" maxlength="4">
            <br>
            <button onclick="joinRoom()">Войти в комнату</button>
        </div>
    </div>

    <div id="game-screen" style="display:none;">
        <div class="section">
            <h3>Игровой стол</h3>
            <div id="players-list">Участники: загрузка...</div>
            <button onclick="leaveRoom()">Выйти в меню</button>
        </div>
    </div>

    <div class="footer-version">
        Версия: 2.1.2 (Beta)
    </div>

    <script>
        // Безопасная инициализация без риска падения скрипта
        let myName = "Игрок_" + Math.floor(Math.random() * 900 + 100);
        try {
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.expand();
                if (tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name) {
                    myName = tg.initDataUnsafe.user.first_name;
                }
            }
        } catch (e) {
            console.log("Telegram init error:", e);
        }
        document.getElementById('user-greeting').innerText = "Игрок: " + myName;

        const DATABASE_URL = "https://cardgame-adee9-default-rtdb.europe-west1.firebasedatabase.app";

        let currentRoomCode = null;
        let hostName = null;
        let guestName = null;
        let isHost = false;
        let pollTimer = null;
        let chatOpen = false;

        function setStatus(text) {
            document.getElementById('game-status').innerHTML = text;
        }

        function updateUI() {
            document.getElementById('players-list').innerHTML = `
                <b>👥 Участники в комнате:</b><br>
                👑 Хост: <b>${hostName || 'Ожидание...'}</b><br>
                🎮 Гость: <b>${guestName || 'Ожидание подключения друга...'}</b>
            `;
        }

        function showGameScreen() {
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            document.getElementById('chat-btn').style.display = 'flex';
            updateUI();
        }

        function showMenuScreen() {
            document.getElementById('menu-screen').style.display = 'block';
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('chat-btn').style.display = 'none';
            document.getElementById('chat-modal').style.display = 'none';
            chatOpen = false;
            setStatus("Статус: Главное меню");
            
            if (pollTimer) {
                clearInterval(pollTimer);
                pollTimer = null;
            }
            currentRoomCode = null;
            hostName = null;
            guestName = null;
            isHost = false;
        }

        function toggleChat() {
            chatOpen = !chatOpen;
            const modal = document.getElementById('chat-modal');
            modal.style.display = chatOpen ? 'block' : 'none';
            if (chatOpen) {
                const box = document.getElementById('chat-messages');
                box.scrollTop = box.scrollHeight;
            }
        }

        async function createRoom() {
            const randomCode = Math.floor(1000 + Math.random() * 9000).toString();
            currentRoomCode = randomCode;
            hostName = myName;
            guestName = null;
            isHost = true;

            setStatus("Создание комнаты...");

            const roomData = {
                host: hostName,
                guest: null,
                status: 'waiting',
                messages: {}
            };

            try {
                const response = await fetch(`${DATABASE_URL}/rooms/${randomCode}.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(roomData)
                });

                if (!response.ok) throw new Error();

                setStatus(`Комната создана!<br>Код для друга: <b style="font-size: 24px; color: #ffeb3b;">${randomCode}</b><br><span style="font-size:12px; color:#ccc;">Ожидание игрока...</span>`);
                showGameScreen();

                startPolling(randomCode);

            } catch(e) {
                setStatus("Ошибка доступа к базе. Проверьте Rules.");
            }
        }

        async function joinRoom() {
            const codeInput = document.getElementById('room-code').value.trim();
            if (codeInput.length !== 4) {
                alert("Введите ровно 4 цифры кода!");
                return;
            }

            currentRoomCode = codeInput;
            isHost = false;
            setStatus("Поиск комнаты " + codeInput + "...");

            try {
                const res = await fetch(`${DATABASE_URL}/rooms/${codeInput}.json`);
                const roomData = await res.json();

                if (!roomData) {
                    setStatus("Комната не найдена или была удалена.");
                    return;
                }

                if (roomData.host === myName) {
                    alert("Нельзя заходить в свою же комнату!");
                    setStatus("Статус: Главное меню");
                    return;
                }

                hostName = roomData.host;
                guestName = myName;
                roomData.guest = myName;
                roomData.status = 'playing';

                const updateRes = await fetch(`${DATABASE_URL}/rooms/${codeInput}.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(roomData)
                });

                if (!updateRes.ok) throw new Error();

                setStatus("<span style='color: #4caf50;'>Успешное подключение!</span>");
                showGameScreen();

                startPolling(codeInput);

            } catch(e) {
                setStatus("Ошибка подключения к комнате.");
            }
        }

        function startPolling(code) {
            if (pollTimer) clearInterval(pollTimer);

            pollTimer = setInterval(async () => {
                try {
                    const res = await fetch(`${DATABASE_URL}/rooms/${code}.json`);
                    const d = await res.json();

                    if (!d) {
                        alert("Хост закрыл комнату!");
                        showMenuScreen();
                        return;
                    }

                    if (isHost && d.guest && d.guest !== guestName) {
                        guestName = d.guest;
                        updateUI();
                        setStatus("<span style='color: #4caf50;'>Игрок успешно подключился!</span>");
                    } else if (!isHost) {
                        hostName = d.host;
                        guestName = d.guest;
                        updateUI();
                    }

                    renderChatMessages(d.messages);

                } catch(e) {}
            }, 1200);
        }

        function renderChatMessages(messagesObj) {
            const box = document.getElementById('chat-messages');
            if (!messagesObj) {
                box.innerHTML = '<div style="color: #aaa; text-align: center; margin-top: 40px;">Нет сообщений...</div>';
                return;
            }

            let html = '';
            const keys = Object.keys(messagesObj);
            keys.sort((a, b) => messagesObj[a].time - messagesObj[b].time);

            keys.forEach(k => {
                const msg = messagesObj[k];
                html += `<div class="chat-msg"><b>${msg.sender}:</b> ${msg.text}</div>`;
            });

            box.innerHTML = html;
            if (chatOpen) {
                box.scrollTop = box.scrollHeight;
            }
        }

        async function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text || !currentRoomCode) return;

            const msgData = {
                sender: myName,
                text: text,
                time: Date.now()
            };

            input.value = '';

            try {
                const url = `${DATABASE_URL}/rooms/${currentRoomCode}/messages.json`;
                await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(msgData)
                });
            } catch(e) {}
        }

        function checkEnter(e) {
            if (e.key === 'Enter') {
                sendChatMessage();
            }
        }

        async function leaveRoom() {
            if (isHost && currentRoomCode) {
                try {
                    await fetch(`${DATABASE_URL}/rooms/${currentRoomCode}.json`, { method: 'DELETE' });
                } catch(e) {}
            }
            showMenuScreen();
        }
    </script>
</body>
</html>
