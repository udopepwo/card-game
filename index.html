<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточный Клуб</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #1c2b36;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        h2 { color: #4caf50; margin-bottom: 5px; font-size: 22px; }
        .card-table {
            background: #2e7d32;
            border: 3px solid #1b5e20;
            border-radius: 14px;
            padding: 15px;
            margin: 15px auto;
            max-width: 400px;
            min-height: 120px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }
        button {
            background: #2481cc;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            margin: 8px;
            font-weight: bold;
        }
        button:active { background: #1b639e; }
        input {
            padding: 10px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            text-align: center;
            width: 80%;
            max-width: 220px;
            margin-bottom: 8px;
            background: #222;
            color: #fff;
        }
        .section {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 10px;
            margin: 10px auto;
            max-width: 400px;
        }
        #players-list {
            font-size: 15px;
            color: #ffeb3b;
            margin-top: 10px;
            line-height: 1.6;
            text-align: left;
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <h2>♣️ Карточный Клуб ♠️</h2>
    <p id="user-greeting" style="font-size: 14px; color: #aaa;">Загрузка...</p>

    <div class="card-table">
        <div id="game-status">Статус: Главное меню</div>
    </div>

    <div id="menu-screen">
        <div class="section">
            <button onclick="createRoom()">Создать комнату</button>
        </div>

        <div class="section">
            <input type="text" id="room-code" placeholder="Введите код из 4 цифр" maxlength="4">
            <br>
            <button onclick="joinRoom()">Войти в комнату</button>
        </div>
    </div>

    <div id="game-screen" style="display:none;">
        <div class="section">
            <h3>Игровой стол</h3>
            <div id="players-list">Участники: загрузка...</div>
            <button onclick="leaveRoom()">Выйти в меню</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        let myName = tg.initDataUnsafe?.user?.first_name || ("Игрок_" + Math.floor(Math.random()*100));
        document.getElementById('user-greeting').innerText = "Игрок: " + myName;

        let ws = null;
        let currentRoomCode = null;

        function setStatus(text) {
            document.getElementById('game-status').innerHTML = text;
        }

        function showGameScreen(hostName, guestName) {
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            document.getElementById('players-list').innerHTML = `
                <b>👥 Участники в комнате:</b><br>
                👑 Хост: <b>${hostName}</b><br>
                🎮 Гость: <b>${guestName || 'Ожидание подключения друга...'}</b>
            `;
        }

        function showMenuScreen() {
            document.getElementById('menu-screen').style.display = 'block';
            document.getElementById('game-screen').style.display = 'none';
            setStatus("Статус: Главное меню");
            if (ws) {
                ws.close();
                ws = null;
            }
        }

        function initWebSocket(onOpenCallback) {
            // Используем публичный защищенный WebSocket на стандартном порту 443
            ws = new WebSocket('wss://demo.piesocket.com/v3/room_cardgame?api_key=VCXCEuvhGcBDP7XhiJJUDvR1e1D3eiVjgZ9VRiaV&notify_self=1');

            ws.onopen = () => {
                onOpenCallback();
            };

            ws.onerror = (err) => {
                setStatus("Ошибка связи: проверьте интернет");
                console.error(err);
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    handleServerMessage(data);
                } catch(e) {}
            };
        }

        let roomData = { host: null, guest: null, code: null };

        function handleServerMessage(data) {
            if (!currentRoomCode) return;

            if (data.room === currentRoomCode) {
                if (data.type === 'create') {
                    roomData.host = data.name;
                    showGameScreen(roomData.host, roomData.guest);
                } else if (data.type === 'join') {
                    roomData.guest = data.name;
                    showGameScreen(roomData.host, roomData.guest);
                    // Отвечаем хосту, что гость в сборе
                    ws.send(JSON.stringify({
                        room: currentRoomCode,
                        type: 'sync',
                        host: roomData.host,
                        guest: roomData.guest
                    }));
                } else if (data.type === 'sync') {
                    roomData.host = data.host;
                    roomData.guest = data.guest;
                    showGameScreen(roomData.host, roomData.guest);
                }
            }
        }

        function createRoom() {
            const randomCode = Math.floor(1000 + Math.random() * 9000).toString();
            currentRoomCode = randomCode;
            roomData = { host: myName, guest: null, code: randomCode };

            setStatus("Подключение к серверу...");

            initWebSocket(() => {
                setStatus(`Комната создана!<br>Код для друга: <b style="font-size: 24px; color: #ffeb3b;">${randomCode}</b><br><span style="font-size:12px; color:#ccc;">Ожидание игрока...</span>`);
                showGameScreen(myName, null);

                ws.send(JSON.stringify({
                    room: randomCode,
                    type: 'create',
                    name: myName
                }));
            });
        }

        function joinRoom() {
            const codeInput = document.getElementById('room-code').value.trim();
            if (codeInput.length !== 4) {
                alert("Введите ровно 4 цифры кода!");
                return;
            }

            currentRoomCode = codeInput;
            setStatus("Подключение к комнате " + codeInput + "...");

            initWebSocket(() => {
                ws.send(JSON.stringify({
                    room: codeInput,
                    type: 'join',
                    name: myName
                }));
                setStatus("<span style='color: #4caf50;'>Запрос отправлен...</span>");
            });
        }

        function leaveRoom() {
            showMenuScreen();
        }
    </script>
</body>
</html>
