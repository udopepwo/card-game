<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточный Клуб</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Подключаем MQTT для мгновенной связи игроков -->
    <script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #1c2b36;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        h2 { color: #4caf50; margin-bottom: 5px; font-size: 22px; }
        .card-table {
            background: #2e7d32;
            border: 3px solid #1b5e20;
            border-radius: 14px;
            padding: 15px;
            margin: 15px auto;
            max-width: 400px;
            min-height: 120px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }
        button {
            background: #2481cc;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            margin: 8px;
            font-weight: bold;
        }
        button:active { background: #1b639e; }
        input {
            padding: 10px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            text-align: center;
            width: 80%;
            max-width: 220px;
            margin-bottom: 8px;
            background: #222;
            color: #fff;
        }
        .section {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 10px;
            margin: 10px auto;
            max-width: 400px;
        }
        #players-list {
            font-size: 15px;
            color: #ffeb3b;
            margin-top: 10px;
            line-height: 1.6;
            text-align: left;
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <h2>♣️ Карточный Клуб ♠️</h2>
    <p id="user-greeting" style="font-size: 14px; color: #aaa;">Загрузка...</p>

    <div class="card-table">
        <div id="game-status">Статус: Главное меню</div>
    </div>

    <div id="menu-screen">
        <div class="section">
            <button onclick="createRoom()">Создать комнату</button>
        </div>

        <div class="section">
            <input type="text" id="room-code" placeholder="Введите код из 4 цифр" maxlength="4">
            <br>
            <button onclick="joinRoom()">Войти в комнату</button>
        </div>
    </div>

    <div id="game-screen" style="display:none;">
        <div class="section">
            <h3>Игровой стол</h3>
            <div id="players-list">Участники: загрузка...</div>
            <button onclick="leaveRoom()">Выйти в меню</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        let myName = tg.initDataUnsafe?.user?.first_name || ("Игрок_" + Math.floor(Math.random()*100));
        document.getElementById('user-greeting').innerText = "Игрок: " + myName;
        const myId = Math.random().toString(36).substring(2, 9);

        let mqttClient = null;
        let currentRoomCode = null;
        let hostName = null;
        let guestName = null;

        function setStatus(text) {
            document.getElementById('game-status').innerHTML = text;
        }

        function updateUI() {
            document.getElementById('players-list').innerHTML = `
                <b>👥 Участники в комнате:</b><br>
                👑 Хост: <b>${hostName || 'Ожидание...'}</b><br>
                🎮 Гость: <b>${guestName || 'Ожидание подключения друга...'}</b>
            `;
        }

        function showGameScreen() {
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            updateUI();
        }

        function showMenuScreen() {
            document.getElementById('menu-screen').style.display = 'block';
            document.getElementById('game-screen').style.display = 'none';
            setStatus("Статус: Главное меню");
            if (mqttClient) {
                mqttClient.end();
                mqttClient = null;
            }
        }

        function initMqtt(onConnected) {
            if (mqttClient && mqttClient.connected) {
                onConnected();
                return;
            }
            mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
                clientId: 'cardgame_' + Math.random().toString(16).substring(2, 8)
            });

            mqttClient.on('connect', () => {
                onConnected();
            });

            mqttClient.on('error', (err) => {
                setStatus("Ошибка подключения к серверу");
                console.error(err);
            });
        }

        // Создание комнаты (Хост)
        function createRoom() {
            const randomCode = Math.floor(1000 + Math.random() * 9000).toString();
            currentRoomCode = randomCode;
            hostName = myName;
            guestName = null;

            setStatus("Подключение к серверу...");

            initMqtt(() => {
                const topic = `cardgame/room/${randomCode}`;
                mqttClient.subscribe(topic, () => {
                    setStatus(`Комната создана!<br>Код для друга: <b style="font-size: 24px; color: #ffeb3b;">${randomCode}</b><br><span style="font-size:12px; color:#ccc;">Ожидание игрока...</span>`);
                    showGameScreen();
                });

                mqttClient.on('message', (t, payload) => {
                    if (t === topic) {
                        try {
                            const data = JSON.parse(payload.toString());
                            if (data.senderId === myId) return;

                            if (data.type === 'join') {
                                guestName = data.name;
                                updateUI();
                                // Отправляем актуальный состав комнаты гостю
                                mqttClient.publish(topic, JSON.stringify({
                                    senderId: myId,
                                    type: 'state',
                                    host: hostName,
                                    guest: guestName
                                }));
                            }
                        } catch(e) {}
                    }
                });
            });
        }

        // Вход в комнату (Гость)
        function joinRoom() {
            const codeInput = document.getElementById('room-code').value.trim();
            if (codeInput.length !== 4) {
                alert("Введите ровно 4 цифры кода!");
                return;
            }

            currentRoomCode = codeInput;
            guestName = myName;

            setStatus("Подключение к комнате " + codeInput + "...");

            initMqtt(() => {
                const topic = `cardgame/room/${codeInput}`;
                mqttClient.subscribe(topic, () => {
                    // Сигнализируем хосту, что мы вошли
                    mqttClient.publish(topic, JSON.stringify({
                        senderId: myId,
                        type: 'join',
                        name: myName
                    }));
                    setStatus("<b>Ожидание ответа от хоста...</b>");
                });

                mqttClient.on('message', (t, payload) => {
                    if (t === topic) {
                        try {
                            const data = JSON.parse(payload.toString());
                            if (data.senderId === myId) return;

                            if (data.type === 'state') {
                                hostName = data.host;
                                guestName = data.guest;
                                setStatus("<span style='color: #4caf50;'>Успешное подключение!</span>");
                                showGameScreen();
                            }
                        } catch(e) {}
                    }
                });
            });
        }

        function leaveRoom() {
            showMenuScreen();
        }
    </script>
</body>
</html>
