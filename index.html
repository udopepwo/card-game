<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточный Клуб</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #1c2b36;
            color: #ffffff;
            margin: 0;
            padding: 10px;
            text-align: center;
        }
        h2 { color: #4caf50; margin: 15px 0 5px 0; font-size: 24px; }

        /* Центрирование главного меню */
        #menu-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 75vh;
            gap: 15px;
        }
        .menu-container {
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Кнопка профиля в стиле карточки в меню */
        .profile-card-btn {
            background: rgba(36, 129, 204, 0.2);
            border: 2px solid #2481cc;
            border-radius: 12px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            transition: background 0.2s;
        }
        .profile-card-btn:active { background: rgba(36, 129, 204, 0.4); }
        .avatar-mini {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #2481cc;
            border: 2px solid #ffeb3b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            overflow: hidden;
            flex-shrink: 0;
        }
        .avatar-mini img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .profile-btn-info {
            text-align: left;
            overflow: hidden;
        }
        .profile-btn-name {
            font-weight: bold;
            font-size: 15px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .profile-btn-sub {
            font-size: 12px;
            color: #4caf50;
        }

        button {
            background: #2481cc;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:active { background: #1b639e; }
        input {
            padding: 12px;
            font-size: 16px;
            border-radius: 10px;
            border: 1px solid #444;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
            background: #16222c;
            color: #fff;
        }
        .section {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 12px;
            width: 100%;
            box-sizing: border-box;
        }

        /* Модальное окно профиля */
        #profile-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .profile-card {
            background: #1c2b36;
            border: 2px solid #2481cc;
            border-radius: 16px;
            width: 100%;
            max-width: 340px;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }
        .close-profile-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: none;
            border: none;
            color: #aaa;
            font-size: 22px;
            cursor: pointer;
            padding: 0;
            margin: 0;
        }
        .avatar-large {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #2481cc;
            border: 3px solid #ffeb3b;
            margin: 0 auto 10px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            overflow: hidden;
        }
        .avatar-large img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .stats-frame {
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.25);
            border-radius: 12px;
            padding: 12px;
            margin-top: 15px;
            text-align: left;
            font-size: 14px;
        }
        .stats-title {
            color: #ffeb3b;
            font-weight: bold;
            margin-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 4px;
        }
        .stats-row {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
            color: #ccc;
        }
        .stats-row span { color: #fff; font-weight: bold; }

        /* Игровые стили */
        .card-table {
            background: #2e7d32;
            border: 3px solid #1b5e20;
            border-radius: 14px;
            padding: 12px;
            margin: 10px auto;
            max-width: 400px;
            position: relative;
        }
        #players-list {
            font-size: 14px;
            color: #ffeb3b;
            margin-top: 8px;
            text-align: left;
            background: rgba(0,0,0,0.2);
            padding: 8px;
            border-radius: 6px;
        }
        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 10px 0;
        }
        .mode-btn { background: #444; padding: 6px 12px; font-size: 12px; border-radius: 6px; }
        .mode-btn.active { background: #4caf50; }
        .tictactoe-grid {
            display: grid;
            grid-template-columns: repeat(3, 75px);
            grid-template-rows: repeat(3, 75px);
            gap: 6px;
            justify-content: center;
            margin: 15px auto;
        }
        .cell {
            background: #16222c;
            border: 2px solid #2481cc;
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            cursor: pointer;
        }
        .chat-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            max-width: 400px;
            margin: 10px auto;
            padding: 8px;
            text-align: left;
        }
        #chat-messages {
            height: 80px;
            overflow-y: auto;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 6px;
            padding: 4px;
            background: rgba(0,0,0,0.2);
            border-radius: 6px;
        }
        .chat-msg { background: rgba(255,255,255,0.08); padding: 4px 8px; border-radius: 6px; }
        .chat-msg b { color: #4caf50; }
        .chat-input-row { display: flex; gap: 6px; }
        .chat-input-row input { margin: 0; padding: 6px; font-size: 12px; }
        .chat-input-row button { margin: 0; padding: 6px 12px; font-size: 12px; }

        .footer-version { margin-top: 15px; font-size: 11px; color: #778899; }
    </style>
</head>
<body>

    <h2>♣️ Карточный Клуб ♠️</h2>

    <!-- Модальное окно профиля -->
    <div id="profile-modal">
        <div class="profile-card">
            <button class="close-profile-btn" id="close-profile">✕</button>
            <div class="avatar-large" id="avatar-large-box">👤</div>
            <h3 id="profile-name" style="margin: 5px 0 0 0; font-size: 18px; color: #4caf50;">Игрок</h3>
            <div id="profile-username" style="font-size: 12px; color: #888; margin-bottom: 10px;">@username</div>

            <div class="stats-frame">
                <div class="stats-title">🏆 Победы:</div>
                <div class="stats-row"><span>Дурак:</span> <span id="win-durak">0</span></div>
                <div class="stats-row"><span>Покер:</span> <span id="win-poker">0</span></div>
                <div class="stats-row"><span>Сундучок:</span> <span id="win-box">0</span></div>
                
                <div class="stats-title" style="margin-top: 10px;">💰 Баланс:</div>
                <div class="stats-row"><span>Текущий баланс:</span> <span id="user-money">0 💰</span></div>
                <div class="stats-row"><span>Макс. денег:</span> <span id="user-max-money">0 💰</span></div>
            </div>
        </div>
    </div>

    <!-- Главное меню (сдвинуто в центр, кнопка профиля в удобном месте) -->
    <div id="menu-screen">
        <div class="menu-container">
            <!-- Красивая кнопка профиля прямо в меню -->
            <div class="profile-card-btn" id="profile-btn">
                <div class="avatar-mini" id="avatar-mini-box">👤</div>
                <div class="profile-btn-info">
                    <div class="profile-btn-name" id="menu-profile-name">Игрок</div>
                    <div class="profile-btn-sub">Открыть профиль ⚙️</div>
                </div>
            </div>

            <div class="section">
                <button id="btn-create" style="width: 100%; padding: 14px; font-size: 16px;">Создать комнату</button>
            </div>
            <div class="section">
                <input type="text" id="room-code-input" placeholder="Введите код из 4 цифр" maxlength="4">
                <button id="btn-join" style="width: 100%; margin-top: 8px;">Войти в комнату</button>
            </div>
        </div>
    </div>

    <!-- Лобби -->
    <div id="lobby-screen" style="display:none;">
        <div class="card-table">
            <div id="game-status">Комната создана</div>
            <div id="players-list">Участники: загрузка...</div>
        </div>
        <div class="section" style="max-width: 400px; margin: 0 auto;">
            <div style="font-size: 13px; margin-bottom: 5px; color: #aaa;">Режим игры:</div>
            <div class="mode-selector">
                <button class="mode-btn" id="mode-poker">Покер</button>
                <button class="mode-btn active" id="mode-tictactoe">Крестики-нолики</button>
            </div>
            <button id="start-btn" style="background: #e65100; width: 100%;">Готов! (0/2)</button>
        </div>
        <br>
        <button id="btn-leave-lobby" style="background: #d32f2f; font-size: 13px; padding: 6px 14px;">Выйти в меню</button>
    </div>

    <!-- Игровой экран -->
    <div id="game-screen" style="display:none;">
        <div class="card-table">
            <h3 id="turn-info" style="margin:0 0 10px 0; font-size: 16px; color: #ffeb3b;">Ход игрока</h3>
            <div class="tictactoe-grid">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>
            <button id="btn-leave-game" style="background: #d32f2f; font-size: 12px; padding: 6px 12px;">Сдаться / В лобби</button>
        </div>
    </div>

    <!-- Чат снизу -->
    <div class="chat-container" id="chat-box-wrapper" style="display:none;">
        <div id="chat-messages">
            <div style="color: #aaa; text-align: center; margin-top: 25px;">Чат пуст...</div>
        </div>
        <div class="chat-input-row">
            <input type="text" id="chat-input" placeholder="Сообщение..." maxlength="100">
            <button id="btn-send-chat">Отправить</button>
        </div>
    </div>

    <div class="footer-version">Версия: 2.3.1 (Beta)</div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            let myName = "Игрок_" + Math.floor(Math.random() * 900 + 100);
            let myUsername = "@player";
            let photoUrl = null;

            try {
                if (window.Telegram && window.Telegram.WebApp) {
                    const tg = window.Telegram.WebApp;
                    tg.expand();
                    if (tg.initDataUnsafe?.user) {
                        const u = tg.initDataUnsafe.user;
                        if (u.first_name) myName = u.first_name;
                        if (u.username) myUsername = "@" + u.username;
                        if (u.photo_url) photoUrl = u.photo_url;
                    }
                }
            } catch (e) {}

            // Заполнение данных профиля
            document.getElementById('profile-name').innerText = myName;
            document.getElementById('menu-profile-name').innerText = myName;
            document.getElementById('profile-username').innerText = myUsername;

            if (photoUrl) {
                document.getElementById('avatar-mini-box').innerHTML = `<img src="${photoUrl}" alt="avatar">`;
                document.getElementById('avatar-large-box').innerHTML = `<img src="${photoUrl}" alt="avatar">`;
            }

            // Управление модальным окном профиля
            const profileModal = document.getElementById('profile-modal');
            document.getElementById('profile-btn').addEventListener('click', () => {
                profileModal.style.display = 'flex';
            });
            document.getElementById('close-profile').addEventListener('click', () => {
                profileModal.style.display = 'none';
            });

            const DATABASE_URL = "https://cardgame-adee9-default-rtdb.europe-west1.firebasedatabase.app";

            let currentRoomCode = null;
            let hostName = null;
            let guestName = null;
            let isHost = false;
            let isReady = false;
            let pollTimer = null;

            function setStatus(text) {
                document.getElementById('game-status').innerHTML = text;
            }

            function updateUI() {
                document.getElementById('players-list').innerHTML = `
                    <b>👥 Участники:</b><br>
                    👑 Хост: <b>${hostName || 'Ожидание...'}</b><br>
                    🎮 Гость: <b>${guestName || 'Ожидание игрока...'}</b>
                `;
            }

            function showScreen(screenId) {
                document.getElementById('menu-screen').style.display = 'none';
                document.getElementById('lobby-screen').style.display = 'none';
                document.getElementById('game-screen').style.display = 'none';
                document.getElementById('chat-box-wrapper').style.display = 'none';

                if (screenId === 'menu-screen') {
                    document.getElementById('menu-screen').style.display = 'flex';
                } else {
                    document.getElementById(screenId).style.display = 'block';
                    document.getElementById('chat-box-wrapper').style.display = 'block';
                }
            }

            document.getElementById('btn-create').addEventListener('click', createRoom);
            document.getElementById('btn-join').addEventListener('click', joinRoom);
            document.getElementById('start-btn').addEventListener('click', toggleReady);
            document.getElementById('btn-leave-lobby').addEventListener('click', leaveRoom);
            document.getElementById('btn-leave-game').addEventListener('click', leaveRoom);
            document.getElementById('btn-send-chat').addEventListener('click', sendChatMessage);
            
            document.getElementById('chat-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendChatMessage();
            });

            document.querySelectorAll('.cell').forEach(cell => {
                cell.addEventListener('click', () => {
                    MakeMove(parseInt(cell.getAttribute('data-index')));
                });
            });

            async function createRoom() {
                const randomCode = Math.floor(1000 + Math.random() * 9000).toString();
                currentRoomCode = randomCode;
                hostName = myName;
                guestName = null;
                isHost = true;
                isReady = false;

                setStatus("Комната создана. Код: <b style='color:#ffeb3b; font-size:20px;'>" + randomCode + "</b>");

                const roomData = {
                    host: hostName,
                    guest: null,
                    status: 'lobby',
                    ready: { [hostName]: false },
                    messages: {},
                    game: { board: ['', '', '', '', '', '', '', '', ''], turn: 'X', winner: null }
                };

                try {
                    await fetch(`${DATABASE_URL}/rooms/${randomCode}.json`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(roomData)
                    });
                    showScreen('lobby-screen');
                    updateUI();
                    startPolling(randomCode);
                } catch(e) {
                    alert("Ошибка создания комнаты!");
                }
            }

            async function joinRoom() {
                const codeInput = document.getElementById('room-code-input').value.trim();
                if (codeInput.length !== 4) { alert("Введите 4 цифры кода!"); return; }

                currentRoomCode = codeInput;
                isHost = false;
                isReady = false;

                try {
                    const res = await fetch(`${DATABASE_URL}/rooms/${codeInput}.json`);
                    const roomData = await res.json();
                    if (!roomData) { alert("Комната не найдена!"); return; }
                    if (roomData.host === myName) { alert("Нельзя заходить к самому себе!"); return; }

                    hostName = roomData.host;
                    guestName = myName;
                    roomData.guest = myName;
                    roomData.ready[myName] = false;

                    await fetch(`${DATABASE_URL}/rooms/${codeInput}.json`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(roomData)
                    });

                    showScreen('lobby-screen');
                    updateUI();
                    startPolling(codeInput);
                } catch(e) {
                    alert("Ошибка подключения.");
                }
            }

            async function toggleReady() {
                isReady = !isReady;
                const btn = document.getElementById('start-btn');
                btn.style.background = isReady ? '#2e7d32' : '#e65100';

                try {
                    await fetch(`${DATABASE_URL}/rooms/${currentRoomCode}/ready/${myName}.json`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(isReady)
                    });
                } catch(e) {}
            }

            function startPolling(code) {
                if (pollTimer) clearInterval(pollTimer);
                pollTimer = setInterval(async () => {
                    try {
                        const res = await fetch(`${DATABASE_URL}/rooms/${code}.json`);
                        const d = await res.json();
                        if (!d) { alert("Комната удалена хостом!"); leaveRoom(); return; }

                        hostName = d.host;
                        guestName = d.guest;
                        updateUI();

                        if (d.status === 'lobby') {
                            let readyCount = 0;
                            let totalCount = d.guest ? 2 : 1;
                            if (d.ready) {
                                if (d.ready[d.host]) readyCount++;
                                if (d.guest && d.ready[d.guest]) readyCount++;
                            }
                            document.getElementById('start-btn').innerText = `Готов! (${readyCount}/${totalCount})`;

                            if (totalCount === 2 && readyCount === 2 && isHost) {
                                await fetch(`${DATABASE_URL}/rooms/${code}/status.json`, {
                                    method: 'PUT',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify('playing')
                                });
                            }
                        }

                        if (d.status === 'playing') {
                            showScreen('game-screen');
                            renderTicTacToe(d.game);
                        }

                        renderChatMessages(d.messages);
                    } catch(e) {}
                }, 1000);
            }

            function renderTicTacToe(gameData) {
                const board = gameData.board;
                const cells = document.querySelectorAll('.cell');
                cells.forEach((cell, idx) => {
                    cell.innerText = board[idx] || '';
                });

                let mySymbol = isHost ? 'X' : 'O';
                let turnInfo = document.getElementById('turn-info');

                if (gameData.winner) {
                    if (gameData.winner === 'draw') turnInfo.innerText = "Ничья! 🤝";
                    else turnInfo.innerText = `Победил: ${gameData.winner === 'X' ? hostName : guestName}! 🎉`;
                    return;
                }

                if (gameData.turn === mySymbol) {
                    turnInfo.innerHTML = `<span style="color:#4caf50;">Ваш ход (${mySymbol})!</span>`;
                } else {
                    let currentTurnName = gameData.turn === 'X' ? hostName : guestName;
                    turnInfo.innerHTML = `Ходит: <b>${currentTurnName} (${gameData.turn})</b>`;
                }
            }

            async function MakeMove(index) {
                try {
                    const res = await fetch(`${DATABASE_URL}/rooms/${currentRoomCode}/game.json`);
                    const game = await res.json();
                    let mySymbol = isHost ? 'X' : 'O';

                    if (game.winner || game.turn !== mySymbol || game.board[index] !== '') return;

                    game.board[index] = mySymbol;
                    game.turn = mySymbol === 'X' ? 'O' : 'X';

                    const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
                    for (let w of wins) {
                        let [a,b,c] = w;
                        if (game.board[a] && game.board[a] === game.board[b] && game.board[a] === game.board[c]) {
                            game.winner = mySymbol;
                        }
                    }
                    if (!game.winner && !game.board.includes('')) {
                        game.winner = 'draw';
                    }

                    await fetch(`${DATABASE_URL}/rooms/${currentRoomCode}/game.json`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(game)
                    });
                } catch(e) {}
            }

            function renderChatMessages(messagesObj) {
                const box = document.getElementById('chat-messages');
                if (!messagesObj) {
                    box.innerHTML = '<div style="color: #aaa; text-align: center; margin-top: 25px;">Чат пуст...</div>';
                    return;
                }
                let html = '';
                const keys = Object.keys(messagesObj);
                keys.sort((a, b) => messagesObj[a].time - messagesObj[b].time);
                keys.forEach(k => {
                    const msg = messagesObj[k];
                    html += `<div class="chat-msg"><b>${msg.sender}:</b> ${msg.text}</div>`;
                });
                box.innerHTML = html;
                box.scrollTop = box.scrollHeight;
            }

            async function sendChatMessage() {
                const input = document.getElementById('chat-input');
                const text = input.value.trim();
                if (!text || !currentRoomCode) return;
                input.value = '';
                try {
                    await fetch(`${DATABASE_URL}/rooms/${currentRoomCode}/messages.json`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ sender: myName, text: text, time: Date.now() })
                    });
                } catch(e) {}
            }

            async function leaveRoom() {
                if (isHost && currentRoomCode) {
                    try { await fetch(`${DATABASE_URL}/rooms/${currentRoomCode}.json`, { method: 'DELETE' }); } catch(e) {}
                }
                if (pollTimer) clearInterval(pollTimer);
                showScreen('menu-screen');
            }
        });
    </script>
</body>
</html>
