<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточный Клуб</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #1c2b36;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        h2 { color: #4caf50; margin-bottom: 5px; font-size: 22px; }
        .card-table {
            background: #2e7d32;
            border: 3px solid #1b5e20;
            border-radius: 14px;
            padding: 15px;
            margin: 15px auto;
            max-width: 400px;
            min-height: 120px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }
        button {
            background: #2481cc;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            margin: 8px;
            font-weight: bold;
        }
        button:active { background: #1b639e; }
        input {
            padding: 10px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            text-align: center;
            width: 80%;
            max-width: 220px;
            margin-bottom: 8px;
            background: #222;
            color: #fff;
        }
        .section {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 10px;
            margin: 10px auto;
            max-width: 400px;
        }
        #players-list {
            font-size: 15px;
            color: #ffeb3b;
            margin-top: 10px;
            line-height: 1.6;
            text-align: left;
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 6px;
        }
        .footer-version {
            margin-top: 30px;
            font-size: 12px;
            color: #778899;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <h2>♣️ Карточный Клуб ♠️</h2>
    <p id="user-greeting" style="font-size: 14px; color: #aaa;">Загрузка...</p>

    <div class="card-table">
        <div id="game-status">Статус: Главное меню</div>
    </div>

    <div id="menu-screen">
        <div class="section">
            <button onclick="createRoom()">Создать комнату</button>
        </div>

        <div class="section">
            <input type="text" id="room-code" placeholder="Введите код из 4 цифр" maxlength="4">
            <br>
            <button onclick="joinRoom()">Войти в комнату</button>
        </div>
    </div>

    <div id="game-screen" style="display:none;">
        <div class="section">
            <h3>Игровой стол</h3>
            <div id="players-list">Участники: загрузка...</div>
            <button onclick="leaveRoom()">Выйти в меню</button>
        </div>
    </div>

    <div class="footer-version">
        Версия: 2.0 (Beta)
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        let myName = tg.initDataUnsafe?.user?.first_name || ("Игрок_" + Math.floor(Math.random()*100));
        document.getElementById('user-greeting').innerText = "Игрок: " + myName;

        const DATABASE_URL = "https://cardgame-adee9-default-rtdb.europe-west1.firebasedatabase.app";

        let currentRoomCode = null;
        let hostName = null;
        let guestName = null;
        let isHost = false;
        let pollTimer = null;

        function setStatus(text) {
            document.getElementById('game-status').innerHTML = text;
        }

        function updateUI() {
            document.getElementById('players-list').innerHTML = `
                <b>👥 Участники в комнате:</b><br>
                👑 Хост: <b>${hostName || 'Ожидание...'}</b><br>
                🎮 Гость: <b>${guestName || 'Ожидание подключения друга...'}</b>
            `;
        }

        function showGameScreen() {
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            updateUI();
        }

        function showMenuScreen() {
            document.getElementById('menu-screen').style.display = 'block';
            document.getElementById('game-screen').style.display = 'none';
            setStatus("Статус: Главное меню");
            if (pollTimer) {
                clearInterval(pollTimer);
                pollTimer = null;
            }
            currentRoomCode = null;
            hostName = null;
            guestName = null;
            isHost = false;
        }

        async function createRoom() {
            const randomCode = Math.floor(1000 + Math.random() * 9000).toString();
            currentRoomCode = randomCode;
            hostName = myName;
            guestName = null;
            isHost = true;

            setStatus("Создание комнаты...");

            const roomData = {
                host: hostName,
                guest: null,
                status: 'waiting'
            };

            try {
                const response = await fetch(`${DATABASE_URL}/rooms/${randomCode}.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(roomData)
                });

                if (!response.ok) throw new Error();

                setStatus(`Комната создана!<br>Код для друга: <b style="font-size: 24px; color: #ffeb3b;">${randomCode}</b><br><span style="font-size:12px; color:#ccc;">Ожидание игрока...</span>`);
                showGameScreen();

                // Опрос статуса комнаты для хоста
                pollTimer = setInterval(async () => {
                    try {
                        const res = await fetch(`${DATABASE_URL}/rooms/${randomCode}.json`);
                        const data = await res.json();
                        if (data && data.guest) {
                            guestName = data.guest;
                            updateUI();
                            setStatus("<span style='color: #4caf50;'>Игрок успешно подключился!</span>");
                        }
                    } catch(e) {}
                }, 1000);

            } catch(e) {
                setStatus("Ошибка доступа к базе. Проверьте Rules в Firebase.");
            }
        }

        async function joinRoom() {
            const codeInput = document.getElementById('room-code').value.trim();
            if (codeInput.length !== 4) {
                alert("Введите ровно 4 цифры кода!");
                return;
            }

            currentRoomCode = codeInput;
            isHost = false;
            setStatus("Поиск комнаты " + codeInput + "...");

            try {
                const res = await fetch(`${DATABASE_URL}/rooms/${codeInput}.json`);
                const roomData = await res.json();

                if (!roomData) {
                    setStatus("Комната не найдена или была удалена.");
                    return;
                }

                if (roomData.host === myName) {
                    alert("Нельзя заходить в свою же комнату!");
                    setStatus("Статус: Главное меню");
                    return;
                }

                hostName = roomData.host;
                guestName = myName;
                roomData.guest = myName;
                roomData.status = 'playing';

                const updateRes = await fetch(`${DATABASE_URL}/rooms/${codeInput}.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(roomData)
                });

                if (!updateRes.ok) throw new Error();

                setStatus("<span style='color: #4caf50;'>Успешное подключение!</span>");
                showGameScreen();

                // Слушаем комнату на случай выхода хоста
                pollTimer = setInterval(async () => {
                    try {
                        const r = await fetch(`${DATABASE_URL}/rooms/${codeInput}.json`);
                        const d = await r.json();
                        if (!d) {
                            alert("Хост закрыл комнату!");
                            showMenuScreen();
                        } else {
                            hostName = d.host;
                            guestName = d.guest;
                            updateUI();
                        }
                    } catch(e) {}
                }, 1500);

            } catch(e) {
                setStatus("Ошибка подключения к комнате.");
            }
        }

        async function leaveRoom() {
            // Если выходит создатель (хост), полностью удаляем комнату из Firebase
            if (isHost && currentRoomCode) {
                try {
                    await fetch(`${DATABASE_URL}/rooms/${currentRoomCode}.json`, { method: 'DELETE' });
                } catch(e) {}
            }
            showMenuScreen();
        }
    </script>
</body>
</html>
