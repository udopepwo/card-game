<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточный Клуб</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #1c2b36;
            color: #ffffff;
            margin: 0;
            padding: 10px;
            text-align: center;
        }
        h2 { color: #4caf50; margin-bottom: 5px; font-size: 20px; }
        .card-table {
            background: #2e7d32;
            border: 3px solid #1b5e20;
            border-radius: 14px;
            padding: 12px;
            margin: 10px auto;
            max-width: 400px;
            min-height: 100px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
            position: relative;
        }
        button {
            background: #2481cc;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            margin: 6px;
            font-weight: bold;
        }
        button:active { background: #1b639e; }
        input {
            padding: 10px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            text-align: center;
            width: 80%;
            max-width: 220px;
            margin-bottom: 8px;
            background: #222;
            color: #fff;
        }
        .section {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 10px;
            margin: 8px auto;
            max-width: 400px;
        }
        #players-list {
            font-size: 14px;
            color: #ffeb3b;
            margin-top: 8px;
            line-height: 1.5;
            text-align: left;
            background: rgba(0,0,0,0.2);
            padding: 8px;
            border-radius: 6px;
        }
        .mode-selector {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 10px 0;
        }
        .mode-btn {
            background: #444;
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 6px;
        }
        .mode-btn.active { background: #4caf50; }

        .tictactoe-grid {
            display: grid;
            grid-template-columns: repeat(3, 75px);
            grid-template-rows: repeat(3, 75px);
            gap: 6px;
            justify-content: center;
            margin: 15px auto;
        }
        .cell {
            background: #16222c;
            border: 2px solid #2481cc;
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            cursor: pointer;
            color: #fff;
        }
        .cell:active { background: #223546; }

        .chat-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            max-width: 400px;
            margin: 10px auto;
            padding: 8px;
            text-align: left;
        }
        #chat-messages {
            height: 90px;
            overflow-y: auto;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 6px;
            padding: 4px;
            background: rgba(0,0,0,0.2);
            border-radius: 6px;
        }
        .chat-msg {
            background: rgba(255,255,255,0.08);
            padding: 4px 8px;
            border-radius: 6px;
            word-break: break-word;
        }
        .chat-msg b { color: #4caf50; }
        .chat-input-row { display: flex; gap: 6px; }
        .chat-input-row input { width: 100%; margin: 0; padding: 6px; font-size: 12px; }
        .chat-input-row button { margin: 0; padding: 6px 12px; font-size: 12px; }

        .footer-version { margin-top: 15px; font-size: 11px; color: #778899; }
    </style>
</head>
<body>

    <h2>♣️ Карточный Клуб ♠️</h2>
    <p id="user-greeting" style="font-size: 13px; color: #aaa;">Инициализация...</p>

    <!-- Главное меню -->
    <div id="menu-screen">
        <div class="section">
            <button onclick="createRoom()">Создать комнату</button>
        </div>
        <div class="section">
            <input type="text" id="room-code" placeholder="Код из 4 цифр" maxlength="4"><br>
            <button onclick="joinRoom()">Войти в комнату</button>
        </div>
    </div>

    <!-- Лобби -->
    <div id="lobby-screen" style="display:none;">
